[project]
name = "gridcarbon"
version = "0.1.0"
description = "Batch lakehouse for hourly grid carbon intensity, price and weather data."
authors = [{ name = "guiDaros" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.29.2",
]

[project.scripts]
gridcarbon = "gridcarbon.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez: no naive datetimes (all timestamps are UTC)
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the pytest idiom

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration", "--strict-markers"]
markers = [
    "integration: needs external services (Azurite); run with `uv run pytest -m integration`",
]
