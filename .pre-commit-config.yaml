# Install once per clone: `uv run pre-commit install` (or `make setup`).
# Run on everything:      `uv run pre-commit run --all-files` (or `make lint`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep `rev` in sync with the ruff version locked in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  # mypy runs from the project venv (not mirrors-mypy) so it sees the real,
  # uv.lock-pinned dependencies and their type information.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        # Check the whole project as configured in [tool.mypy] `files`,
        # not just the staged files, so cross-module errors are caught.
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml$|uv\.lock$)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
